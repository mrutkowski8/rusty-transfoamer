[package]
name = "rusty-transfoamer"
version = "0.1.0"
edition = "2024"
description = "Audits raw option data exports and turns them into clean, point-in-time data for backtests"
publish = false

[dependencies]
arrow-array = "60.2"
arrow-schema = "60.2"
bytes = "1.12"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
clap = { version = "4.6", features = ["derive"] }
# the export uses zstd and snappy only
parquet = { version = "60.2", default-features = false, features = ["arrow", "zstd", "snap"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = "9.8"

[dev-dependencies]
tempfile = "3.27"

[profile.dev.package."*"]
opt-level = 2
